name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-release:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Decode Release Keystore
        id: decode_keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_DIR="${RUNNER_TEMP}/keystore"
          mkdir -p "$KEYSTORE_DIR"
          KEYSTORE_FILE="$KEYSTORE_DIR/focusflow-release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          echo "path=$KEYSTORE_FILE" >> $GITHUB_OUTPUT

      - name: Build Android Release APK
        working-directory: mobile
        env:
          KEYSTORE_PATH: ${{ steps.decode_keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release

      - name: Secure Cleanup (Shred temporary keystore)
        if: always()
        run: |
          if [ -d "${RUNNER_TEMP}/keystore" ]; then
            find "${RUNNER_TEMP}/keystore" -type f -exec shred -u {} + 2>/dev/null || rm -rf "${RUNNER_TEMP}/keystore"
            echo "Securely shredded temporary keystore files."
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FocusFlow-Release-APK
          path: mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
